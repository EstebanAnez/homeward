<head>

<title>Homeward</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a calm website (wide sections) that hands off to a phone-width app column. Tokens from the Homeward brand kit. */
:root {
  --surface:#FBF7F0; --raised:#FFFFFF; --sage:#E4EFE9; --line:#E2DACB; --line-strong:#8C8576;
  --ink:#1D2726; --muted:#4C5857; --hearth:#1F5E5B; --on-hearth:#FFFFFF; --hearth-soft:#DCEBE6;
  --porch:#E9A23B; --on-porch:#1D2726; --porch-soft:#FBEBCF;
  --done:#2D6E46; --pending:#7A4E00; --pending-soft:#FCEBC9; --help:#A23B22; --help-soft:#F9E0D8;
  --font-display:"Fraunces", Georgia, "Times New Roman", serif;
  --font-sans:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm:8px; --r-md:16px; --r-lg:28px; --tap:56px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface:#141B1A; --raised:#1C2524; --sage:#1F2E2A; --line:#2E3A38; --line-strong:#6F7D7A;
  --ink:#F3EFE6; --muted:#B9C3C0; --hearth:#6FC3B5; --on-hearth:#0E1716; --hearth-soft:#1E3B37;
  --porch:#F0B45A; --porch-soft:#3A2E1A; --done:#7FD19C; --pending:#F2C46B; --pending-soft:#3A2E14; --help:#F29A80; --help-soft:#3D211A;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --surface:#141B1A; --raised:#1C2524; --sage:#1F2E2A; --line:#2E3A38; --line-strong:#6F7D7A;
  --ink:#F3EFE6; --muted:#B9C3C0; --hearth:#6FC3B5; --on-hearth:#0E1716; --hearth-soft:#1E3B37;
  --porch:#F0B45A; --porch-soft:#3A2E1A; --done:#7FD19C; --pending:#F2C46B; --pending-soft:#3A2E14; --help:#F29A80; --help-soft:#3D211A;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 18px; line-height: 28px; padding: 0 16px 48px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 32px; line-height: 40px; }
h2 { font-size: 26px; line-height: 34px; }
h3 { font-size: 22px; line-height: 30px; }
p { margin: 0; }
a { color: var(--hearth); text-underline-offset: 3px; }
.muted { color: var(--muted); }
.small { font-size: 16px; line-height: 24px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.site { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 72px; padding-top: 24px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); margin: 0 -16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.top-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top.app .top-in, .top.app .steps, .top.app .stepname { max-width: 560px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 22px; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0; min-height: 44px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.spacer { flex: 1; }
.navlinks { display: flex; gap: 4px; flex-wrap: wrap; }
.navlinks button { font: inherit; font-size: 16px; font-weight: 700; background: none; border: 0; color: var(--ink); padding: 8px 10px; min-height: 44px; cursor: pointer; border-radius: var(--r-sm); }
.navlinks button:hover { background: var(--hearth-soft); }
.lang { display: flex; border: 2px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.lang button { font: inherit; font-size: 16px; font-weight: 700; background: transparent; color: var(--ink); border: 0; padding: 4px 12px; min-height: 40px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--hearth); color: var(--on-hearth); }
.steps { display: flex; gap: 6px; margin: 10px auto 0; }
.steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.steps span.on { background: var(--hearth); }
.stepname { margin: 6px auto 0; font-size: 16px; line-height: 22px; color: var(--muted); font-weight: 700; }

/* controls */
.btn { font: inherit; font-size: 18px; font-weight: 700; min-height: var(--tap); padding: 0 22px; border-radius: var(--r-md); border: 2px solid var(--line-strong); background: var(--raised); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none; }
.btn.primary { background: var(--hearth); border-color: var(--hearth); color: var(--on-hearth); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--hearth); text-decoration: underline; text-underline-offset: 4px; padding: 0 10px; }
.btn.small { min-height: 48px; font-size: 16px; padding: 0 16px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, .navlinks button:focus-visible, .lang button:focus-visible, .brand:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--hearth); outline-offset: 3px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
input[type="text"], input[type="tel"], input[type="date"], input[type="time"], input[type="number"], textarea, select { font: inherit; font-size: 18px; color: var(--ink); background: var(--raised); border: 2px solid var(--line-strong); border-radius: var(--r-sm); min-height: var(--tap); padding: 10px 14px; width: 100%; }
textarea { min-height: 140px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
label.field .hint { font-weight: 400; font-size: 16px; line-height: 22px; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 10px; }
.seg label { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 18px; border: 2px solid var(--line-strong); border-radius: var(--r-md); cursor: pointer; background: var(--raised); font-weight: 700; }
.seg input { width: 22px; height: 22px; accent-color: var(--hearth); }
.seg label:has(input:checked) { border-color: var(--hearth); background: var(--hearth-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }

/* surfaces */
.screen { display: flex; flex-direction: column; gap: 20px; padding-top: 24px; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sage { background: var(--sage); border-radius: var(--r-md); padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; }
.why { background: var(--sage); border-radius: var(--r-sm); padding: 12px 16px; }
.note { background: var(--porch-soft); border-radius: var(--r-sm); padding: 12px 16px; font-size: 16px; line-height: 24px; }
.bottom { position: sticky; bottom: 0; background: var(--surface); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); margin: 0 -16px; z-index: 4; }
.bottom .in { max-width: 560px; margin: 0 auto; display: flex; gap: 12px; }
.bottom .in .btn { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; line-height: 22px; font-weight: 700; padding: 3px 12px; border-radius: 999px; border: 2px solid transparent; white-space: nowrap; }
.chip svg { width: 18px; height: 18px; flex: none; }
.chip.help { border: 2px dashed var(--help); color: var(--help); }
.chip.pending { background: var(--pending-soft); color: var(--pending); }
.chip.accepted { background: var(--hearth-soft); border-color: var(--hearth); color: var(--hearth); }
.chip.done { background: var(--done); color: var(--on-hearth); }
.tag { display: inline-block; font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--pending); background: var(--pending-soft); border-radius: 6px; padding: 1px 8px; }
.meta { font-size: 16px; line-height: 24px; color: var(--muted); }
.quote { font-size: 16px; line-height: 24px; color: var(--muted); border-left: 3px solid var(--line-strong); padding-left: 12px; }
.check { display: flex; gap: 12px; align-items: flex-start; }
.check input { width: 28px; height: 28px; accent-color: var(--hearth); flex: none; margin-top: 2px; }
.dayhead { font-size: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.day { display: flex; flex-direction: column; gap: 12px; }
.opt { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border: 2px solid var(--line-strong); border-radius: var(--r-md); cursor: pointer; background: var(--raised); }
.opt input { width: 24px; height: 24px; accent-color: var(--hearth); flex: none; margin-top: 3px; }
.opt:has(input:checked) { border-color: var(--hearth); background: var(--hearth-soft); }
.opt-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.opt .t { font-weight: 700; }
.payrow { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.payrow:last-child { border-bottom: 0; }
.payrow > div:first-child { min-width: 0; }
.payrow .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.total { background: var(--porch-soft); border-radius: var(--r-sm); padding: 14px 16px; display: flex; justify-content: space-between; font-size: 22px; line-height: 30px; font-weight: 700; }
.bar { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--hearth); border-radius: 6px; }
.event { border: 2px solid var(--porch); background: var(--porch-soft); border-radius: var(--r-md); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); }
.item > div { min-width: 0; }
.linkbox { font-size: 15px; line-height: 22px; word-break: break-all; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r-sm); padding: 10px 12px; user-select: all; }
.history { margin: 0; padding-left: 20px; font-size: 16px; line-height: 24px; color: var(--muted); }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 5px solid var(--hearth-soft); border-top-color: var(--hearth); }
@media (prefers-reduced-motion: no-preference) { .spinner { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } .screen { animation: in .25s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(6px);} to { opacity: 1; transform: none; } } }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 12px 20px; border-radius: var(--r-md); font-weight: 700; max-width: calc(100% - 32px); z-index: 20; }
details summary { cursor: pointer; font-weight: 700; color: var(--hearth); min-height: 44px; display: flex; align-items: center; }
.res { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.res .phone { font-weight: 700; font-variant-numeric: tabular-nums; user-select: all; }

/* website */
.hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; padding-top: 24px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 32px; } }
.hero h1 { font-size: clamp(40px, 6vw, 64px); line-height: 1.05; }
.hero .lead { font-size: 22px; line-height: 34px; color: var(--muted); max-width: 32em; }
.hero .ctas { display: flex; flex-wrap: wrap; gap: 12px; }
.eyebrow { font-size: 16px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--hearth); }
.phone { background: var(--raised); border: 1px solid var(--line); border-radius: 32px; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 420px; justify-self: center; width: 100%; position: relative; }
.phone::before { content: ""; position: absolute; inset: -18px -18px auto auto; width: 120px; height: 160px; background: var(--porch); border-radius: 60px 60px 0 0; z-index: -1; }
.phone::after { content: ""; position: absolute; inset: auto auto -18px -18px; width: 140px; height: 140px; background: var(--sage); border-radius: 50%; z-index: -1; }
.mini { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--raised); }
.mini h3 { font-size: 19px; line-height: 26px; }
.section { display: flex; flex-direction: column; gap: 28px; }
.section > h2 { font-size: clamp(30px, 4vw, 40px); line-height: 1.15; max-width: 20em; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
.step { display: flex; flex-direction: column; gap: 10px; padding: 24px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-md); }
.step .n { font-family: var(--font-display); font-size: 40px; line-height: 1; color: var(--hearth); }
.band { background: var(--hearth); color: var(--on-hearth); border-radius: var(--r-lg); padding: 40px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.band h2 { color: var(--on-hearth); font-size: clamp(28px, 4vw, 38px); line-height: 1.15; }
.band p { color: var(--on-hearth); }
@media (max-width: 760px) { .band { grid-template-columns: 1fr; padding: 28px 20px; } }
.ladder { display: flex; flex-direction: column; gap: 10px; }
.ladder .chip { align-self: flex-start; }
.ladder .chip.help { color: var(--on-hearth); border-color: var(--on-hearth); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
.panel { padding: 28px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.panel ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.cta-end { text-align: center; display: flex; flex-direction: column; gap: 18px; align-items: center; padding: 48px 20px; background: var(--sage); border-radius: var(--r-lg); }
footer { font-size: 15px; line-height: 22px; color: var(--muted); text-align: center; max-width: 720px; margin: 24px auto 0; }
</style>

  const rules = [[/lift|carry/i, 'Someone needs to carry food and deliveries', 'Alguien debe cargar la comida y las entregas'], [/stand/i, 'Help with meals while standing is limited', 'Ayuda con las comidas mientras no pueda estar de pie'], [/follow-?up|appointment|clinic.*\d/i, 'A ride to the follow-up appointment', 'Transporte a la cita de control'], [/may not drive|no driving/i, 'Rides while they can’t drive', 'Transporte mientras no pueda manejar'], [/language|spanish|español/i, 'Instructions in their language', 'Instrucciones en su idioma'], [/walker|cane|wheelchair/i, 'Make room at home for the walker', 'Hacer espacio en casa para la andadera']];
  for (const [re, en, es] of rules) { const src = lines.find(l => re.test(l)); if (src && !out.some(o => o.source === src)) out.push({ id: uid('t'), text: S.lang === 'es' ? es : en, source: src, on: true }); }
  return out;
}

function factsForAI() {

    fromPaper: d.tasks.filter(x => x.on).map(x => x.text), alreadyArranged: d.arranged, caregiverAvailability: d.youWhen,
    helpers: d.helpers.map(h => ({ id: h.id, name: h.name, who: h.rel, free: h.when })),
    localResources: RESOURCES.map(r => ({ id: r.id, kind: r.kind, name: r.name, about: r.en })) };
}
async function aiFindGaps() {
  if (!SAMPLE) throw { code: 'unavailable' };
  const lang = S.lang === 'es' ? 'Spanish' : 'English';
  const prompt = `You are the planning step of Homeward, which helps a family caregiver cover practical, NON-CLINICAL needs in the first 72 hours after a hospital discharge (day 1 = discharge day, then days 2 and 3).
Never give medical advice; never choose equipment, diet or medicine; never judge whether discharge is safe. Use only the facts below.
A "gap" is something needed in the 72 hours that nothing already arranged and nobody available clearly covers AT THAT TIME. Look especially for dependencies: help that starts later leaves earlier hours uncovered; a delivery needs someone home who can carry it in and store it; a ride needs someone free with a car; a pantry needs someone to pick food up; a person who cannot stand needs meals that need no cooking.
Reply with only JSON:
{"covered":[{"title":"what is already handled","by":"who or what"}],
 "gaps":[{"title":"short task, max 6 words","day":1,"when":"e.g. by 6 pm","why":"one sentence, max 22 words, naming the concrete reason from the facts","helperIds":["ids of helpers whose stated free time fits"],"resourceIds":["ids from localResources that could help"],"selfFits":true}]}
At most 5 gaps, most urgent first. Only ids that appear in the facts. Write titles and sentences in ${lang}, plain words, about 6th-grade reading level.
FACTS:
${JSON.stringify(factsForAI())}`;
  const out = await SAMPLE.json(prompt, { modelTier: 'default' });
  if (!out || !Array.isArray(out.gaps)) throw { code: 'invalid_json' };
  return { covered: Array.isArray(out.covered) ? out.covered.slice(0, 6) : [], gaps: out.gaps.slice(0, 5).map(g => ({ id: uid('g'), title: String(g.title || ''), day: Math.min(3, Math.max(1, Number(g.day) || 1)) - 1, when: String(g.when || ''), why: String(g.why || ''),
    helperIds: (g.helperIds || []).filter(id => S.draft.helpers.some(h => h.id === id)), resourceIds: (g.resourceIds || []).filter(id => RESOURCES.some(r => r.id === id)), selfFits: g.selfFits !== false, handled: false })) };
}
function rulesFindGaps() {
  const d = S.draft, es = S.lang === 'es', g = [];
  const arr = d.arranged.join(' ').toLowerCase();
  const mealsLater = /meal|comida/.test(arr) && /tomorrow|mañana/.test(arr);
  const hasMeals = /meal|comida/.test(arr);
  if (d.cook !== 'yes' && (!hasMeals || mealsLater)) g.push({ title: es ? 'Cena de hoy' : 'Dinner tonight', day: 0, when: es ? 'antes de las 6 pm' : 'by 6 pm', why: mealsLater ? (es ? 'Las comidas empiezan mañana, así que hoy en la noche no está cubierto.' : 'The meals start tomorrow, so tonight is not covered yet.') : (es ? `${d.name} no puede cocinar todavía y no hay comidas organizadas.` : `${d.name} can’t cook yet and no meals are arranged.`), resourceIds: ['mow', 'justfood'] });
  if (d.carry !== 'yes' && hasMeals) g.push({ title: es ? 'Meter la entrega a la casa' : 'Bring the delivery inside', day: 1, when: es ? 'en la ventana de entrega' : 'during the delivery window', why: es ? `${d.name} no puede cargar la caja y alguien debe guardar las comidas en el refri.` : `${d.name} can’t carry the box, and someone needs to put the meals in the fridge.`, resourceIds: [] });
  if (d.carry !== 'yes' && !hasMeals) g.push({ title: es ? 'Traer comida a la casa' : 'Get groceries home', day: 1, when: es ? 'mañana' : 'tomorrow', why: es ? `${d.name} no puede cargar bolsas; alguien debe traer la comida.` : `${d.name} can’t carry bags, so someone needs to bring food home.`, resourceIds: ['justfood', 'mow'] });
  if (d.drive !== 'yes' && !/drive|ride|maneja|lleva/.test(arr)) g.push({ title: es ? 'Transporte a la cita' : 'Ride to the follow-up', day: 2, when: es ? 'reservar ya' : 'book now', why: es ? `${d.name} no puede manejar y nadie tiene el viaje asignado.` : `${d.name} can’t drive, and no one has the ride yet.`, resourceIds: ['seniorwheels', 'independence', 'tlift'] });
  if (d.alone === 'yes') g.push({ title: es ? 'Visita de la primera noche' : 'First-night check-in', day: 0, when: es ? 'esta noche' : 'tonight', why: es ? `${d.name} va a estar sola en casa la primera noche.` : `${d.name} will be home alone the first night.`, resourceIds: ['adrc'] });
  return { covered: d.arranged.map(a => ({ title: a, by: '' })), gaps: g.slice(0, 5).map(x => ({ id: uid('g'), helperIds: d.helpers.map(h => h.id), selfFits: true, handled: false, ...x })) };
}

/* ===== Options per gap ===== */
function optionsFor(gap) {
  const d = S.plan || S.draft, o = [];
  const helpers = d.helpers.filter(h => gap.helperIds.includes(h.id)).concat(d.helpers.filter(h => !gap.helperIds.includes(h.id)));
  helpers.forEach(h => o.push({ key: 'h:' + h.id, type: 'helper', helperId: h.id, title: t('optAsk', { name: esc(h.name) }), fit: t('optAskFit', { name: esc(h.name), when: esc(h.when || '') }), price: 0 }));
  gap.resourceIds.forEach(rid => { const r = RESOURCES.find(x => x.id === rid); if (r) o.push({ key: 'r:' + rid, type: 'resource', resourceId: rid, title: t('optCall', { name: esc(r.name) }), fit: esc(r[S.lang] || r.en), cost: r.cost[S.lang] || r.cost.en, price: 0 }); });
  if (d.youWhen) o.push({ key: 'self', type: 'self', title: t('optSelf'), fit: t('optSelfFit', { when: esc(d.youWhen) }), price: 0 });
  o.push({ key: 'paid', type: 'paid', title: t('optPaid'), fit: t('optPaidFit'), price: 0 });
  return o;
}

/* ===== Payment ===== */
function payRows() {
  const plan = S.plan; let budget = S.useBudget ? BUDGET : 0; let you = 0, used = 0;
  const rows = S.gaps.filter(g => !g.handled && g.choice).map(g => {
    const c = g.choice; let payer, why, price = 0;
    if (c.type === 'helper') { const h = plan.helpers.find(x => x.id === c.helperId); payer = t('payerFamily', { name: esc(h ? h.name : '') }); why = t('payerFamilyWhy'); }
    else if (c.type === 'self') { payer = t('payerSelf'); why = t('payerSelfWhy'); }
    else if (c.type === 'resource') { const r = RESOURCES.find(x => x.id === c.resourceId); payer = t('payerRes'); why = esc(r.cost[S.lang] || r.cost.en) + ' ' + t('payerResWhy'); }
    else { price = Math.max(0, Number(g.quote) || 0); const cov = Math.min(price, budget); budget -= cov; used += cov; you += price - cov;
      payer = cov === price && price > 0 ? t('payerBudget') : cov > 0 ? t('payerMix', { a: money(cov), b: money(price - cov) }) : t('payerYou');
      why = cov > 0 ? t('payerBudgetWhy') : t('payerYouWhy'); }
    return { g, payer, why, price };
  });
  return { rows, you, used };
}

function gapCard(g) {

function vPlan() {
  const p = S.plan, tot = S.tasks.length, cov = S.tasks.filter(x => x.status === 'accepted' || x.status === 'done').length, dn = S.tasks.filter(x => x.status === 'done').length;

}
function taskCard(x) {
  const name = esc(S.plan.name); let extra = '';
  if (x.check === 'arrived') extra = `<div class="event"><p><strong>${t('arrivedQ')}</strong></p><div class="actions"><button class="btn primary" data-a="arrived" data-v="${x.id}" data-x="yes">${t('yesArrived')}</button><button class="btn" data-a="arrived" data-v="${x.id}" data-x="no">${t('noArrived')}</button></div></div>`;
  else if (x.check === 'usable') extra = `<div class="event"><p><strong>${t('usableQ', { name })}</strong></p><div class="actions"><button class="btn primary" data-a="usable" data-v="${x.id}" data-x="yes">${t('yesUse')}</button><button class="btn" data-a="usable" data-v="${x.id}" data-x="no">${t('noUse')}</button></div></div>`;
  else if (x.status === 'helpme') extra = `<div class="event"><p><strong>${t('nextH')}</strong></p>${x.ideas ? `<p class="small">${esc(x.ideas)}</p>` : ''}<div class="actions">${x.ownerType === 'helper' && !x.declined ? `<button class="btn primary" data-a="askAgain" data-v="${x.id}">${t('askAgain', { name: esc(x.ownerName) })}</button>` : ''}<button class="btn" data-a="reChoose" data-v="${x.id}">${t('tryOther')}</button>${SAMPLE ? `<button class="btn quiet" data-a="ideas" data-v="${x.id}">${x.ideasBusy ? t('ideasLoading') : t('ideas')}</button>` : ''}</div></div>`;
  else if (x.status === 'waiting') extra = `<div class="actions"><button class="btn small" data-a="markYes" data-v="${x.id}">${x.ownerType === 'resource' ? t('iCalled') : t('saidYes')}</button></div>`;
  else if (x.status === 'accepted') extra = `<div class="actions"><button class="btn small" data-a="checkIt" data-v="${x.id}">${t('checkIt')}</button></div>`;
  const res = x.ownerType === 'resource' ? RESOURCES.find(r => r.id === x.resourceId) : null;
  return `<div class="card"><h3>${esc(x.title)}</h3><p class="meta">${esc(x.when)} · ${esc(x.ownerLabel)}</p><div>${chip(x.status)}</div>
    ${res && res.phone && x.status !== 'done' ? `<p class="small">${t('call')}: <span class="phone">${esc(res.phone)}</span></p>` : ''}
    ${x.note ? `<p class="why">${esc(x.note)}</p>` : ''}${extra}
    ${x.history && x.history.length ? `<details><summary>${t('history')}</summary><ol class="history">${x.history.map(h => `<li>${esc(h.t)} · ${esc(h.m)}</li>`).join('')}</ol></details>` : ''}</div>`;
}

/* ===== Helper view (opened from a link) ===== */
function vHelper() {

      ${x.status === 'waiting' ? `<div class="actions"><button class="btn primary" data-a="hYes" data-v="${x.id}">${t('hlpYes')}</button><button class="btn" data-a="hNo" data-v="${x.id}">${t('hlpNo')}</button></div>` : ''}
      ${x.status === 'accepted' ? `<button class="btn primary" data-a="hDone" data-v="${x.id}">${t('hlpDone')}</button>` : ''}</div>`).join('') : `<p>${t('hlpNone')}</p>`}

/* ===== Render ===== */
function render() {
  renderTop();
  const V = { home: vHome, resources: vResources, about: vAbout, paper: vPaper, help: vHelp, building: vBuilding, gaps: vGaps, choose: vChoose, pay: vPay, plan: vPlan, helper: vHelper };
  document.getElementById('app').innerHTML = (V[S.view] || vHome)();
  try { localStorage.setItem('hw-lang', S.lang); } catch (e) {}
}
function go(v) { S.view = v; window.scrollTo(0, 0); render(); }
function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600); }
function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function hist(x, m) { x.history = x.history || []; x.history.push({ t: nowLabel(), m }); }

/* ===== Actions ===== */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (['choose', 'photo', 'quote', 'budget', 'toggleTask'].includes(a)) return; // handled on change
  const d = S.draft;
  switch (a) {
    case 'home': go('home'); break;
    case 'jump': { if (S.view !== 'home') go('home'); const el = document.getElementById(v); if (el) el.scrollIntoView({ behavior: 'smooth' }); break; }
    case 'lang': S.lang = v; render(); break;
    case 'go': go(v); break;
    case 'startReal': S.draft = blankDraft(); S.gaps = []; S.photo = null; S.photoName = ''; go('about'); break;
    case 'startSample': S.draft = sampleDraft(); S.gaps = []; S.photo = null; S.photoName = ''; go('about'); break;
    case 'resume': resume(); break;
    case 'toPaper': go('paper'); break;
    case 'readPaper': await readPaper(); break;
    case 'skipPaper': go('help'); break;
    case 'addTask': { const s = val('f-newtask'); if (s) { d.tasks.push({ id: uid('t'), text: s, source: '', on: true }); render(); } break; }
    case 'toHelp': go('help'); break;
    case 'addArr': { const s = val('f-arr'); if (s) { d.arranged.push(s); render(); } break; }
    case 'delArr': d.arranged.splice(Number(v), 1); render(); break;
    case 'addHelper': { const n = val('h-name'); if (!n) { document.getElementById('h-name').focus(); break; } d.helpers.push({ id: uid('h'), name: n, rel: val('h-rel'), when: val('h-when'), phone: val('h-phone') }); render(); break; }
    case 'delHelper': d.helpers.splice(Number(v), 1); render(); break;
    case 'buildPlan': await buildPlan(); break;
    case 'handle': S.gaps.find(g => g.id === v).handled = true; render(); break;
    case 'unhandle': S.gaps.find(g => g.id === v).handled = false; render(); break;
    case 'edit': S.editing = v; render(); break;
    case 'cancelEdit': S.editing = null; render(); break;
    case 'saveEdit': { const g = S.gaps.find(g => g.id === v); g.title = val('e-title') || g.title; g.when = val('e-when'); g.why = document.getElementById('e-why').value.trim(); S.editing = null; render(); break; }
    case 'toChoose': S.editing = null; go('choose'); break;
    case 'toPay': go('pay'); break;
    case 'confirmPlan': await confirmPlan(); break;
    case 'copy': { const text = v === 'link' ? SHARE_URL + '#h-' + S.pid : document.getElementById('msgtext').textContent; try { await navigator.clipboard.writeText(text); toast(t('copied')); } catch (err) { const box = document.getElementById('linkbox'); if (box) { const r = document.createRange(); r.selectNodeContents(box); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } } break; }
    case 'markYes': { const x = task(v); x.status = 'accepted'; hist(x, x.ownerType === 'resource' ? (S.lang === 'es' ? 'Usted llamó; dijeron que sí' : 'You called; they said yes') : (S.lang === 'es' ? `${x.ownerName} le dijo que sí` : `${x.ownerName} told you yes`)); await saveTask(x); render(); break; }
    case 'checkIt': { const x = task(v); x.check = 'arrived'; render(); break; }
    case 'arrived': { const x = task(v); if (b.dataset.x === 'yes') { x.check = 'usable'; hist(x, S.lang === 'es' ? 'Llegó' : 'Arrived'); } else { x.check = null; x.status = 'helpme'; x.note = t('reopenNote'); hist(x, S.lang === 'es' ? 'No llegó; sigue abierto' : 'Did not arrive; kept open'); } await saveTask(x); render(); break; }
    case 'usable': { const x = task(v); x.check = null; if (b.dataset.x === 'yes') { x.status = 'done'; x.note = ''; hist(x, S.lang === 'es' ? 'Completada: llegó y la pudo usar' : 'Completed: arrived and usable'); toast(t('status_done')); } else { x.status = 'helpme'; x.note = t('reopenNote'); hist(x, S.lang === 'es' ? 'Llegó pero no la pudo usar; se reabrió' : 'Arrived but not usable; reopened'); } await saveTask(x); render(); break; }
    case 'askAgain': { const x = task(v); x.status = 'waiting'; x.note = ''; x.helperDone = false; hist(x, S.lang === 'es' ? `Se le pidió a ${x.ownerName} que lo arregle` : `Asked ${x.ownerName} to fix it`); await saveTask(x); render(); break; }
    case 'reChoose': reChoose(v); break;
    case 'ideas': await ideas(v); break;
    case 'newPlan': S.pid = null; S.savedPid = null; if (unsubTasks) { unsubTasks(); unsubTasks = null; } try { localStorage.removeItem('hw-current'); } catch (err) {} S.draft = blankDraft(); go('about'); break;
    case 'iAm': S.helperMe = v; render(); break;
    case 'hYes': await helperSet(v, 'accepted', S.lang === 'es' ? 'Dijo que sí' : 'Said yes'); break;
    case 'hNo': await helperSet(v, 'helpme', S.lang === 'es' ? 'Dijo que no puede' : 'Said they can’t', true); break;
    case 'hDone': await helperSet(v, 'accepted', S.lang === 'es' ? 'Dice que ya está hecho' : 'Says it’s done', false, true); break;
  }
});
document.addEventListener('input', e => { const f = e.target.dataset.f; if (f) S.draft[f] = e.target.value; });
document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.a, f = el.dataset.f;
  if (f) { S.draft[f] = el.value; return; }
  if (a === 'photo') { S.photo = el.files && el.files[0] || null; S.photoName = S.photo ? S.photo.name : ''; render(); }
  else if (a === 'toggleTask') { const x = S.draft.tasks.find(x => x.id === el.dataset.v); if (x) x.on = el.checked; }
  else if (a === 'choose') { const g = S.gaps.find(g => g.id === el.dataset.g); g.choice = optionsFor(g).find(o => o.key === el.dataset.v); if (g.choice.type === 'paid' && g.quote == null) g.quote = S.draft.sample ? 35 : ''; render(); }
  else if (a === 'quote') { const g = S.gaps.find(g => g.id === el.dataset.g); g.quote = el.value; render(); }
  else if (a === 'budget') { S.useBudget = el.checked; render(); }
});
function task(id) { return S.tasks.find(x => x.id === id); }

/* ===== Flows ===== */
async function readPaper() {
  const d = S.draft; S.paperErr = '';
  if (!S.photo && !d.paperText.trim()) { S.paperErr = S.lang === 'es' ? 'Agregue una foto o pegue el texto, o toque “No lo tengo”.' : 'Add a photo or paste the text, or tap “I don’t have it”.'; render(); return; }
  S.busy = true; render(); await ready;
  try { d.tasks = await aiReadPaper(d.paperText, S.photo); S.aiUsed = true; }
  catch (err) { if (S.photo && !d.paperText.trim()) { S.paperErr = S.lang === 'es' ? 'No pudimos leer la foto aquí. Pegue el texto, por favor.' : 'We couldn’t read the photo here. Please paste the text instead.'; } else { d.tasks = rulesReadPaper(d.paperText); S.paperErr = t('errAI'); } }
  S.busy = false; render();
}
async function buildPlan() {
  const d = S.draft;
  if (!d.name) { go('about'); setTimeout(() => { const el = document.getElementById('f-name'); if (el) el.focus(); }, 50); return; }
  go('building'); await ready;
  let res; S.aiErr = false;
  try { res = await aiFindGaps(); S.aiUsed = true; }
  catch (err) { res = rulesFindGaps(); S.aiUsed = false; S.aiErr = !!SAMPLE; }
  S.gaps = res.gaps; S.covered = res.covered.filter(c => c && c.title);
  S.pid = uid('p'); S.rechoosing = false;
  S.plan = { id: S.pid, name: d.name, you: d.you || (S.lang === 'es' ? 'su cuidador' : 'your caregiver'), rel: d.rel, date: d.date, time: d.time, city: d.city, plang: d.plang, limit: d.limit, helpers: d.helpers, youWhen: d.youWhen, sample: d.sample, lang: S.lang, createdAt: Date.now() };
  S.gaps.forEach(g => { const o = optionsFor(g); g.choice = o.find(x => x.type === 'helper' && g.helperIds.includes(x.helperId)) || o.find(x => x.type === 'resource') || null; });
  go('gaps');
}
async function confirmPlan() {
  const p = S.plan; const { rows } = payRows();
  const fresh = S.gaps.filter(g => !g.handled && g.choice).map(g => {
    const c = g.choice; const row = rows.find(r => r.g.id === g.id);
    const x = { id: g.id, title: g.title, when: g.when, day: g.day, why: g.why, ownerType: c.type, price: row ? row.price : 0, payer: row ? row.payer.replace(/<[^>]+>/g, '') : '', history: [], note: '', check: null, updatedAt: Date.now() };
    if (c.type === 'helper') { const h = p.helpers.find(h => h.id === c.helperId); x.helperId = c.helperId; x.ownerName = h ? h.name : ''; x.ownerLabel = (S.lang === 'es' ? 'Se le pidió a ' : 'Asked ') + x.ownerName; x.status = 'waiting'; hist(x, (S.lang === 'es' ? 'Solicitud enviada a ' : 'Request sent to ') + x.ownerName); }
    else if (c.type === 'resource') { const r = RESOURCES.find(r => r.id === c.resourceId); x.resourceId = r.id; x.ownerName = r.name; x.ownerLabel = (S.lang === 'es' ? 'Llamar: ' : 'Call: ') + r.name; x.status = 'waiting'; hist(x, S.lang === 'es' ? 'Falta llamar para confirmar' : 'Needs a call to confirm'); }
    else if (c.type === 'self') { x.ownerName = p.you; x.ownerLabel = p.you; x.status = 'accepted'; hist(x, S.lang === 'es' ? 'Usted se encarga' : 'You’re handling it'); }
    else { x.ownerName = S.lang === 'es' ? 'Ayuda pagada' : 'Paid help'; x.ownerLabel = `${x.ownerName} · ${money(x.price)} · ${x.payer}`; x.status = 'accepted'; hist(x, (S.lang === 'es' ? 'Pago simulado aprobado: ' : 'Simulated payment approved: ') + money(x.price)); }
    return x;
  });
  S.tasks = S.rechoosing ? S.tasks.filter(o => !fresh.some(n => n.id === o.id)).concat(fresh) : fresh; S.rechoosing = false;
  p.payment = { youPay: payRows().you, budgetUsed: payRows().used, simulated: true };
  await savePlan(); for (const x of fresh) await saveTask(x);
  subscribeTasks(); go('plan');
}
function reChoose(id) {
  const x = task(id); const g = S.gaps.find(g => g.id === id) || { id, title: x.title, day: x.day, when: x.when, why: x.why, helperIds: [], resourceIds: [], selfFits: true };
  if (!S.gaps.includes(g)) S.gaps.push(g);
  g.handled = false; g.choice = null; S.gaps.forEach(o => { if (o.id !== id) o.handled = true; });
  S.tasks = S.tasks.filter(t2 => t2.id !== id); S.rechoosing = true;
  go('choose');
}
async function ideas(id) {
  const x = task(id); if (!SAMPLE) return; x.ideasBusy = true; render();
  const lang = S.lang === 'es' ? 'Spanish' : 'English';
  try {
    const r = await SAMPLE(`A family caregiver arranged practical, non-clinical help after a hospital discharge, but it did not work. Task: "${x.title}". What happened: ${x.history.map(h => h.m).join('; ')}. Helpers: ${JSON.stringify(S.plan.helpers.map(h => ({ name: h.name, free: h.when })))}. Local programs: ${JSON.stringify(RESOURCES.map(r => ({ name: r.name, phone: r.phone, about: r.en })))}.
Suggest the 2 most practical next steps in ${lang}, at most 45 words total, plain words, no medical advice, only using the helpers and programs listed.`, { modelTier: 'quick', cache: false });
    x.ideas = r.text;
  } catch (err) { x.ideas = ''; }
  x.ideasBusy = false; render();
}
function resume() {
  try { const raw = localStorage.getItem('hw-plan-' + S.savedPid); if (raw) { const o = JSON.parse(raw); S.pid = S.savedPid; S.plan = o.plan; S.tasks = o.tasks || []; subscribeTasks(); go('plan'); return; } } catch (e) {}
  go('about');
}

/* ===== Helper link mode ===== */
async function helperSet(id, status, msg, declined, done) {
  const x = S.helperTasks.find(x => x.id === id); if (!x) return;
  const cg = S.helperPlan.you || '';
  x.status = status; x.declined = !!declined; if (declined) x.note = (S.lang === 'es' ? `${x.ownerName} no puede con esta.` : `${x.ownerName} can’t do this one.`);
  if (done) { x.check = 'arrived'; x.note = (S.lang === 'es' ? `${x.ownerName} dice que ya está. Por favor revise.` : `${x.ownerName} says it’s done. Please check.`); }
  x.history = x.history || []; x.history.push({ t: nowLabel(), m: `${x.ownerName}: ${msg}` }); x.updatedAt = Date.now();
  const ok = await dbWrite('plans/' + S.helperPid + '/tasks/' + x.id, x);
  S.helperMsg = ok ? t('hlpSaved', { cg: esc(cg) }) : t('hlpFail', { cg: esc(cg) }); render();
}
async function startHelper(pid) {
  S.view = 'helper'; S.helperPid = pid; S.helperState = 'loading'; render(); await ready;
  if (!DB) { S.helperState = 'missing'; render(); return; }
  unsubHelper.push(DB.doc('plans/' + pid).onSnapshot(s => { if (s.exists) { S.helperPlan = s.data(); S.helperState = 'ok'; let pref = null; try { pref = localStorage.getItem('hw-lang'); } catch (e) {} if (S.helperPlan.lang && !pref) S.lang = S.helperPlan.lang; } else { S.helperState = 'missing'; } render(); }, () => { S.helperState = 'missing'; render(); }));
  unsubHelper.push(DB.collection('plans/' + pid + '/tasks').onSnapshot(s => { S.helperTasks = s.docs.map(d => structuredClone(d.data())); render(); }, () => {}));
}

/* ===== Boot ===== */
const h = location.hash || '';
if (/^#h-p[a-z0-9]+$/i.test(h)) startHelper(h.slice(3)); else render();
ready.then(() => { if (S.view !== 'helper') render(); });
</script>
